<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sana's Boutique — Chat with us</title>
<style>
  :root{
    --plum: #5C2A3D;
    --ivory: #FAF6EF;
    --gold: #B8935A;
    --blush: #F1E4DA;
    --ink: #2B2024;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--ivory);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display:flex;
    flex-direction:column;
    background: var(--ivory);
    box-shadow: 0 0 40px rgba(0,0,0,0.08);
  }
  header{
    background: var(--plum);
    color: var(--ivory);
    padding: 18px 20px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .avatar{
    width:42px; height:42px;
    border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-weight:600;
    font-size:18px;
    color: var(--plum);
  }
  .header-text h1{
    font-size: 19px;
    font-weight:600;
    margin:0;
  }
  .header-text p{
    margin:2px 0 0;
    font-size:12.5px;
    color: var(--blush);
    opacity:0.85;
  }
  .status-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:#7BC67E;
    display:inline-block;
    margin-right:5px;
  }
  .thread{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .bubble{
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .bot{
    align-self:flex-start;
    background: #fff;
    border: 1px solid var(--blush);
    border-bottom-left-radius:4px;
  }
  .user{
    align-self:flex-end;
    background: var(--plum);
    color: var(--ivory);
    border-bottom-right-radius:4px;
  }
  .quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding: 0 16px 12px;
  }
  .quick-replies button{
    background:#fff;
    border:1px solid var(--gold);
    color: var(--plum);
    font-size:13px;
    padding:7px 13px;
    border-radius:14px;
    cursor:pointer;
  }
  form{
    display:flex;
    gap:10px;
    padding: 12px 14px;
    background: #fff;
    border-top:1px solid var(--blush);
  }
  input[type="text"]{
    flex:1;
    border: 1.5px solid var(--blush);
    border-radius: 22px;
    padding: 11px 16px;
    font-size:14.5px;
    outline:none;
    background: var(--ivory);
  }
  button.send{
    background: var(--plum);
    color: var(--ivory);
    border:none;
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  button.send svg{
    width:18px; height:18px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">S</div>
    <div class="header-text">
      <h1>Sana's Boutique</h1>
      <p><span class="status-dot"></span>Aapki madad ke liye hazir</p>
    </div>
  </header>

  <div class="thread" id="thread"></div>

  <div class="quick-replies" id="quickReplies">
    <button type="button" data-q="Timings kya hain?">Timings</button>
    <button type="button" data-q="Delivery kitne din mein hoti hai?">Delivery</button>
    <button type="button" data-q="Naye lawn suits ka rate kya hai?">Rates</button>
  </div>

  <form id="chatForm">
    <input type="text" id="userInput" placeholder="Apna sawal likhein..." autocomplete="off">
    <button type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const quickReplies = document.getElementById('quickReplies');

  // Message dikhane ka function
  function addBubble(text, sender){
    const div = document.createElement('div');
    div.className = 'bubble ' + sender;
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  // Bot ka jawab dene ka function (Offline Demo)
  function getBotReply(userText){
    const text = userText.toLowerCase();
    
    if (text.includes("timing") || text.includes("waqt") || text.includes("khula") || text.includes("band")) {
        return "Humari dukan rozana subah 11 baje se raat 9 baje tak khuli hoti hai. Jumma ko 2 se 4 tak band rehti hai.";
    } 
    else if (text.includes("delivery") || text.includes("pohanch") || text.includes("courier")) {
        return "Lahore ke andar 1-2 din, aur baqi Pakistan mein 3-5 din mein delivery hoti hai. Charges Rs. 200 hain, lekin Rs. 3000 se upar order par free hai.";
    } 
    else if (text.includes("rate") || text.includes("price") || text.includes("qeemat") || text.includes("kitne ka")) {
        return "Naye lawn suits Rs. 2500 se Rs. 6500 tak available hain. Design ke hisab se rate change hota hai.";
    } 
    else if (text.includes("location") || text.includes("shop") || text.includes("kahan") || text.includes("address")) {
        return "Humari dukan Main Boulevard, Gulberg, Lahore mein hai.";
    } 
    else if (text.includes("payment") || text.includes("paise") || text.includes("advance") || text.includes("cod")) {
        return "Hum Cash on Delivery (COD) aur Bank Transfer/EasyPaisa dono accept karte hain.";
    }
    else if (text.includes("return") || text.includes("exchange") || text.includes("wapas")) {
        return "Return ya Exchange sirf 3 din ke andar ho sakta hai, shart ye hai ke tags lage hon aur kapra istemal na hua ho.";
    }
    else {
        return "Assalam-o-Alaikum! Sana's Boutique mein khush aamdeed 🌸 Aap timings, delivery, rates, ya location ke baray mein pooch sakte hain.";
    }
  }

  // Message bhejne ka function
  function handleSend(text){
    if(!text.trim()) return;
    addBubble(text, 'user');
    input.value = '';
    
    // Thori si der baad bot ka jawab aayega (asli AI jaisa feel dene ke liye)
    setTimeout(() => {
        const reply = getBotReply(text);
        addBubble(reply, 'bot');
    }, 600);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    handleSend(input.value);
  });

  quickReplies.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-q]');
    if(btn) handleSend(btn.dataset.q);
  });

  // Shuru mein welcome message
  addBubble("Assalam-o-Alaikum! Sana's Boutique mein khush aamdeed 🌸 Aap ka kya sawal hai?", 'bot');
</script>

</body>
</html>
